
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayCheck</title>
    <link rel="stylesheet" href="style_insert.css">
</head>
<body>

    <header>
        <div class="logo">PayCheck</div>
        <nav>
            <a href="./">Início</a>
            <a href="./insert.html">Inserir</a>
        </nav>
    </header>

    <main>
        <div class="content">
            <form id="form-transferencia">
                <table class="tabela_insert">
                    <tbody>
                        <tr>
                            <td><label for="emissor">Emissor(CPF):</label></td>
                            <td><input id="emissor" type="text" required maxlength="11" minlength="11" placeholder="Apenas números"></td>
                        </tr>
                        <tr>
                            <td><label for="receptor">Receptor(CPF):</label></td>
                            <td><input id="receptor" type="text" required maxlength="11" minlength="11" placeholder="Apenas números"></td>
                        </tr>
                        <tr>
                            <td><label for="valor">Valor(BRL):</label></td>
                            <td><input id="valor" type="number" step="0.01" required inputmode="numeric" min="0.01" max="9999999999999.99" placeholder="Max: 9999999999999.99"></td>
                        </tr>
                    </tbody>
                </table>
                <button type="submit">Salvar</button>
            </form>
        </div>
    </main>
    <script>
        // Função chamada quando o formulário é enviado
        async function enviarTransferencia(event) {
            // Impede o navegador de recarregar a página ao clicar em Salvar
            event.preventDefault();

            // Pega os elementos dos campos na tela
            const campoEmissor = document.getElementById("emissor");
            const campoReceptor = document.getElementById("receptor");
            const campoValor = document.getElementById("valor");

            // Lê o que foi digitado em cada campo
            const emissor = campoEmissor.value;
            const receptor = campoReceptor.value;
            const valor = campoValor.value;

            // Monta o pacote de dados para enviar ao servidor
            const dados = {
                emissor: emissor,
                receptor: receptor,
                valor: valor
            };

            // Envia os dados via POST para a rota /transferencias
            const resposta = await fetch("/transferencias", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            });

            // Lê a resposta do servidor e mostra na tela
            const mensagem = await resposta.text();
            alert(mensagem);

            // Limpa os campos apenas se o registro foi salvo com sucesso
            if (mensagem === "Salvo!") {
                formulario.reset();
            }
        }

        // Liga a função ao evento de envio do formulário
        const formulario = document.getElementById("form-transferencia");
        formulario.addEventListener("submit", enviarTransferencia);
    </script>
</body>
</html>
