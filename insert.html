
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayCheck</title>
    <link rel="stylesheet" href="style_insert.css">
</head>
<body>

    <header>
        <div class="logo">PayCheck</div>
        <nav>
            <a href="./">Início</a>
            <a href="./insert.html">Inserir</a>
        </nav>
    </header>

    <main>
        <div class="content">
            <table class="tabela_insert">
                <tbody>
                    <tr>
                        <td><label for="emissor">Emissor(CPF):</label></td>
                        <td><input id="emissor" type="text"></td>
                    </tr>
                    <tr>
                        <td><label for="receptor">Receptor(CPF):</label></td>
                        <td><input id="receptor" type="text"></td>
                    </tr>
                    <tr>
                        <td><label for="valor">Valor(BRL):</label></td>
                        <td><input id="valor" type="number" step="0.01"></td>
                    </tr>
                    <tr>
                        <td><label for="data">Data:</label></td>
                        <td><input id="data" type="datetime-local"></td>
                    </tr>
                </tbody>
            </table>
            <button onclick="">Salvar</button>
        </div>
    </main>
</body>
</html>
