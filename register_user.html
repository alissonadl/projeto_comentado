
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayCheck</title>
    <link rel="stylesheet" href="style_insert_e_register.css">
</head>
<body>

    <header>
        <div class="logo">PayCheck</div>
        <nav>
            <a href="./">Início</a>
            <a href="./insert.html">Inserir</a>
            <a href="./register_user.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <div class="content">
           <form id="form-cadastro">
                <table>
                    <thead>
                        <tr>
                            <th colspan="2">Formulário de cadastro de usuários</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><label for="nome">Nome:</label></td>
                            <td><input type="text" id="nome" placeholder="Apenas o primeiro nome" maxlength="20" required></td>
                        </tr>
                        <tr>
                            <td><label for="sobrenome">Sobrenome:</label></td>
                            <td><input type="text" id="sobrenome" placeholder="Sobrenome completo" maxlength="40" required></td>
                        </tr>
                        <tr>
                            <td><label for="cpf">CPF:</label></td>
                            <td><input type="text" id="cpf" minlength="11" maxlength="11" placeholder="Apenas números" required></td>
                        </tr>
                        <tr>
                            <td><label for="data_nascimento">Data de nascimento:</label></td>
                            <td><input id="data_nascimento" type="date" required></td>
                        </tr>
                    </tbody>
                </table>
                <div class="container_botoes">
                    <button type="submit">Salvar</button>
                    <button type="button" onclick="limpar()">Limpar</button>
                    <script>
                        function limpar(){
                            const formulario = document.getElementById('form-cadastro');
                            formulario.reset()
                        }
                    </script>
                </div>
           </form>
        </div>
    </main>
    <script>
        async function solicitarCadastro(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const sobrenome = document.getElementById('sobrenome').value;
            const cpf = document.getElementById('cpf').value;
            const data_nascimento = document.getElementById('data_nascimento').value;

            const dados = {
                nome:nome,
                sobrenome:sobrenome,
                cpf:cpf,
                data_nascimento:data_nascimento
            }

            const resposta = await fetch ("/cadastro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            });

            const mensagem = await resposta.text();
            alert(mensagem);

            // Limpa os campos apenas se o registro foi salvo com sucesso
            if (mensagem === "Cadastro realizado com sucesso!") {
                formulario.reset();
            
            }
        }
        const formulario = document.getElementById("form-cadastro");
        formulario.addEventListener("submit", solicitarCadastro);
    </script>
</body>
</html>
